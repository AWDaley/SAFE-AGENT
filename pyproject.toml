[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tervoro-safe-agent"
version = "0.1.0"
description = "Contract-first, fail-closed foundation for the Tervoro SAFE-AGENT Virtual Office"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5", "sqlalchemy==2.0.50", "alembic==1.18.4"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.12.12", "mypy==1.17.1", "httpx==0.28.1"]
api = ["fastapi==0.128.2", "uvicorn==0.35.0"]
postgres = ["psycopg[binary]>=3.2,<4"]
google-test = ["httpx==0.28.1", "cryptography==46.0.4"]
coordinated-offline = ["httpx==0.28.1", "cryptography==45.0.7", "fastapi==0.128.2", "uvicorn==0.35.0", "packaging==26.3"]

[project.scripts]
safe-agent = "safe_agent.__main__:main"
safe-agent-doctor = "safe_agent.runtime.preflight:main"

[tool.setuptools.package-data]
"safe_agent.operator_ui" = ["index.html", "app.js", "styles.css", "recovery.html", "recovery.js"]
"safe_agent.runtime" = ["coordinated-linux-py312.json", "coordinated-linux-py312.lock"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/safe_agent"]
warn_unused_configs = true
check_untyped_defs = true

[tool.uv]
package = true
