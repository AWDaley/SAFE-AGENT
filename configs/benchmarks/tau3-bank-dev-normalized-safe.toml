# Frozen English-text τ³ v1.0.1. Inspect is offline; run invokes configured models.
# Fixed development selection: the first five banking IDs in pinned source order.
# These IDs become development exposure when this pilot is executed.
# Normalized agent transport: zero provider retries and a 2048-token output cap
# for both systems. This remains a full-system comparison, not an ablation.
# Monetary fields are unchanged development reservation allowances, not invoices.
# The $10 run allowance / $0.10 attempt hold permits 100 SAFE model attempts
# across five conversations (20 each on average). Pilot-calibrate further runs.
schema_version = 1
tau_commit = "fc0055dc4e0a316c3f83133267fbd6faaa770992"
tau_root = "../tau2-bench-v1.0.1"
domain = "banking_knowledge"
system = "safe_agent"
stage = "development"
run_id = "tau3-bank-dev-normalized-safe"
output_dir = "artifacts/tau3/bank-dev-normalized-safe"
task_split_name = "base"
num_trials = 1
num_tasks = 5
task_ids = ["task_001", "task_002", "task_003", "task_004", "task_005"]
seed = 300
max_steps = 200
max_errors = 10
max_concurrency = 1
max_retries = 0
retrieval_config = "bm25"
model_route = "openai"
llm_agent = "gpt-4.1-2025-04-14"
llm_user = "gpt-4.1-2025-04-14"
development_task_ids = ["task_001", "task_002", "task_003", "task_004", "task_005"]
runtime_factory = "safe_agent.orchestration.episode_runtime:runtime_factory"

[llm_args_agent]
temperature = 0.0
num_retries = 0
max_tokens = 2048

[llm_args_user]
temperature = 0.0

[episode_budget]
max_turns = 200
max_model_calls = 200
max_tool_calls = 200
max_tokens = 2000000
max_cost_microusd = 10000000
deadline_seconds = 3600
max_prompt_bytes = 131072
max_output_tokens = 2048
max_attempt_cost_microusd = 100000
max_schema_repairs = 1

# These hard limits govern SAFE's runtime. Stock/user/judge costs are external.
[run_budget]
max_turns = 100000
max_model_calls = 100000
max_tool_calls = 100000
max_tokens = 1000000000
max_cost_microusd = 10000000
deadline_seconds = 604800
