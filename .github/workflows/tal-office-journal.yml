name: TAL office shadow journal conformance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SAFE-AGENT and pinned TAL source
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'
          python -m pip install 'git+https://github.com/AWDaley/TervoroAgenticLanguage-TAL-.git@e9d09ef47c0e0e18f3955f9c58f7a8941baf6c38'
      - name: TAL office journal and legacy runtime tests
        run: |
          python -m pytest -q tests/m4/test_tal_office_journal.py tests/m4/test_tal_runtime_dispatch.py tests/m5/test_upstream_office_bridge.py tests/m5/test_tal_execution_authority.py tests/m5/test_google_test_outbox.py tests/m5/test_google_recovery.py tests/m5/test_google_provider_binding.py tests/m5/test_google_acceptance_preflight.py
      - name: Static typing and lint
        run: |
          ruff check src/safe_agent/tal src/safe_agent/execution/recovery.py tests/m4/test_tal_office_journal.py
          mypy src/safe_agent
