name: W4 coordinated planning acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  planning-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: safe_planning_ci
          POSTGRES_PASSWORD: disposable_planning_ci_only
          POSTGRES_DB: safe_planning_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safe_planning_ci -d safe_planning_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SAFE_AGENT_DATABASE_URL: postgresql+psycopg://safe_planning_ci:disposable_planning_ci_only@localhost:5432/safe_planning_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install project and PostgreSQL test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev,postgres]'
      - name: Lint including the new forward migration
        run: |
          ruff check --diff src tests scripts migrations/versions/0013_coordinated_planning.py
          ruff check src tests scripts migrations/versions/0013_coordinated_planning.py
      - name: Operator planning and forward-migration integration
        run: pytest --tb=short tests/m7/test_coordinated_planning.py tests/m7/test_coordinated_planning_schema.py
      - name: Mandatory real PostgreSQL planning integration
        env:
          SAFE_AGENT_TEST_POSTGRES_PLANNING: '1'
        run: |
          pytest --tb=short tests/m7/test_planning_postgres.py --junitxml=w4-postgres.xml
          python -c "import xml.etree.ElementTree as E; s=E.parse('w4-postgres.xml').getroot().findall('testsuite'); assert s and sum(int(x.get('tests',0)) for x in s)>=12; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))"
