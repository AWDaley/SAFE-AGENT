name: Coordinated runtime profile acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve review candidate (not installation or runtime acceptance)
        run: python scripts/resolve_coordinated_profile.py --resolve
