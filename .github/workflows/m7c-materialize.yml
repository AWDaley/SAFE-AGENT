name: M7-05c exact source materialization
on:
  push:
    branches: [feature/m7-coordinated-inference-dispatch]
    paths: [.github/workflows/m7c-materialize.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact patch and publish only non-workflow source
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import lzma
          import subprocess
          from pathlib import Path
          parts = [Path(f'ci/m7c-source.part{i}') for i in range(3)]
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '4611b6f5e9f6114cacabf38a9fabe4bc6e37ecd724d4c2a8be4f7f35f4679942':
              raise SystemExit('Source patch digest mismatch')
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'rm', '--', *map(str, parts), '.github/workflows/m7c-materialize.yml'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if tree != '323ae45a98f732bbf7aaf35e449d7ecdbe50332b':
              raise SystemExit('Source tree differs from locally tested tree')
          # GITHUB_TOKEN may not edit workflows. Publish source only; the
          # authorized GitHub connector will apply the reviewed CI file and
          # remove this transfer workflow, then verify the exact final tree.
          subprocess.run(['git', 'restore', '--source=HEAD', '--staged', '--worktree', '.github/workflows'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M7-05c: fenced offline inference coordinator and crash recovery'
          git push origin HEAD:refs/heads/feature/m7-coordinated-inference-dispatch
