name: SAFE-AGENT checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'
      - name: Ruff + schema checks
        run: |
          ruff check --diff src tests scripts
          ruff check src tests scripts
          python scripts/export_schemas.py --check
          python scripts/export_m1_schemas.py --check
          python scripts/export_m2_schemas.py --check
          python scripts/export_m3_schemas.py --check
          python scripts/export_m5_schemas.py --check
      - name: Static typing
        run: mypy src/safe_agent
      - name: Tests
        run: pytest
      - name: M6 operator intake and synthetic workflow tests
        run: |
          pytest -q tests/m6
          node --check src/safe_agent/operator_ui/app.js
      - name: M5 offline release preparation (live gate stays blocked)
        run: python scripts/check_m5_release.py --mode offline
      - name: Compile source
        run: python -m compileall -q src
      - name: Synthetic M4 process-restart recovery smoke
        run: |
          python -m safe_agent m4-demo
      - name: M5 Google test connector offline smoke
        run: python -m safe_agent m5-demo
      - name: M6 supervised synthetic worker smoke
        run: python -m safe_agent m6-worker-demo
      - name: M6 persistent text-only planning smoke
        run: python -m safe_agent m6-planning-demo
      - name: Docker-isolated offline text model smoke (no container network)
        run: |
          docker version
          docker build --pull -f docker/model_runtime.Dockerfile -t safe-agent-offline-model:ci .
          export SAFE_AGENT_ISOLATION_IMAGE_ID="$(docker image inspect --format '{{.Id}}' safe-agent-offline-model:ci)"
          python - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          from safe_agent.model_runtime import DockerIsolatedTextGenerator, ModelIsolationPolicy
          from safe_agent.contracts.actions import parse_proposal_json
          from tests.m6.test_isolated_model_runtime import prompt

          runtime = DockerIsolatedTextGenerator(
              ModelIsolationPolicy(image_id=os.environ["SAFE_AGENT_ISOLATION_IMAGE_ID"])
          )
          with tempfile.TemporaryDirectory() as temp:
              argv = runtime._argv(Path(temp) / "probe.cid")
              result = subprocess.run(
                  argv, input=prompt().encode(), stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE, timeout=15, cwd="/",
                  env={"PATH": "/usr/bin:/bin", "HOME": "/nonexistent",
                       "DOCKER_CONFIG": "/nonexistent"},
              )
              print("synthetic_container_probe_exit", result.returncode)
              print("synthetic_container_probe_stdout_bytes", len(result.stdout))
              if result.returncode:
                  print("synthetic_container_probe_docker_stderr",
                        result.stderr.decode(errors="replace")[:1000])
                  raise SystemExit(1)
              parse_proposal_json(result.stdout.decode())
              print("synthetic_container_probe_valid_proposal")
          PY
          python -m safe_agent m6-isolated-model-demo
      - name: Migration head smoke (isolated SQLite fixture)
        env:
          SAFE_AGENT_DATABASE_URL: sqlite+pysqlite:///./ci-m4-migration.sqlite
        run: |
          alembic upgrade head
          python -c "from sqlalchemy import create_engine, inspect; e=create_engine('sqlite+pysqlite:///./ci-m4-migration.sqlite'); assert {'safe_action_outbox', 'safe_fake_provider_effects', 'safe_fake_provider_state', 'safe_google_test_connections', 'safe_google_oauth_pending', 'safe_office_execution_authorizations', 'safe_google_test_outbox_bindings', 'safe_task_intake_keys', 'safe_planning_workspaces', 'safe_planning_attempts', 'safe_planning_outcomes'} <= set(inspect(e).get_table_names()); assert {'provider_simulation_hash', 'provider_simulation_json'} <= {x['name'] for x in inspect(e).get_columns('safe_google_test_outbox_bindings')}"

  tal-office-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SAFE-AGENT and pinned upstream TAL office domain
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'
          TAL_SHA="$(python scripts/read_tal_pin.py)"
          python -m pip install "git+https://github.com/AWDaley/TervoroAgenticLanguage-TAL-.git@${TAL_SHA}"
      - name: Verify TAL office-domain interoperability
        run: pytest -q tests/m4/test_tal_office_journal.py tests/m5/test_upstream_office_bridge.py tests/m4/test_tal_runtime_dispatch.py tests/m5/test_tal_execution_authority.py tests/m5/test_google_test_outbox.py tests/m5/test_google_recovery.py tests/m5/test_google_provider_binding.py tests/m5/test_google_acceptance_preflight.py
