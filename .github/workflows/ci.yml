name: SAFE-AGENT checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'
      - name: Ruff + schema checks
        run: |
          ruff check --diff src tests scripts
          ruff check src tests scripts
          python scripts/export_schemas.py --check
          python scripts/export_m1_schemas.py --check
          python scripts/export_m2_schemas.py --check
          python scripts/export_m3_schemas.py --check
          python scripts/export_m5_schemas.py --check
      - name: Static typing
        run: mypy src/safe_agent
      - name: Tests
        run: pytest
      - name: Compile source
        run: python -m compileall -q src
      - name: Synthetic M4 process-restart recovery smoke
        run: |
          python -m safe_agent m4-demo
      - name: M5 Google test connector offline smoke
        run: python -m safe_agent m5-demo
      - name: Migration head smoke (isolated SQLite fixture)
        env:
          SAFE_AGENT_DATABASE_URL: sqlite+pysqlite:///./ci-m4-migration.sqlite
        run: |
          alembic upgrade head
          python -c "from sqlalchemy import create_engine, inspect; e=create_engine('sqlite+pysqlite:///./ci-m4-migration.sqlite'); assert {'safe_action_outbox', 'safe_fake_provider_effects', 'safe_fake_provider_state', 'safe_google_test_connections', 'safe_google_oauth_pending'} <= set(inspect(e).get_table_names())"

  tal-office-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SAFE-AGENT and pinned upstream TAL office domain
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'
          python -m pip install 'git+https://github.com/AWDaley/TervoroAgenticLanguage-TAL-.git@c869390752f4a142e0a9605bb211a827510d1cff'
      - name: Verify TAL office-domain interoperability
        run: pytest -q tests/m5/test_upstream_office_bridge.py tests/m4/test_tal_runtime_dispatch.py
