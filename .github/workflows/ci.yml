name: SAFE-AGENT checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies and reviewed TAL runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'
          TAL_SHA="$(python scripts/read_tal_pin.py)"
          python -m pip install "git+https://github.com/AWDaley/TervoroAgenticLanguage-TAL-.git@${TAL_SHA}"
          python -c "from safe_agent.tal.reviewed_runtime import require_reviewed_tal_runtime; require_reviewed_tal_runtime()"
      - name: Ruff + schema checks
        run: |
          ruff check --diff src tests scripts migrations/versions/0010_inference_dispatch.py migrations/versions/0011_inference_admission.py
          ruff check src tests scripts migrations/versions/0010_inference_dispatch.py migrations/versions/0011_inference_admission.py
          python scripts/export_schemas.py --check
          python scripts/export_m1_schemas.py --check
          python scripts/export_m2_schemas.py --check
          python scripts/export_m3_schemas.py --check
          python scripts/export_m5_schemas.py --check
          python scripts/export_m7_dispatch_schemas.py --check
          python scripts/export_m7_admission_schemas.py --check
          python scripts/export_m7_coordinator_schemas.py --check
      - name: Static typing
        run: mypy src/safe_agent
      - name: Tests
        run: pytest
      - name: M6 operator intake and synthetic workflow tests
        run: |
          pytest -q tests/m6
          node --check src/safe_agent/operator_ui/app.js
      - name: M7 provider-neutral inference contract and mock tests
        run: pytest -q tests/m7
      - name: M7 restricted TLS egress and SSRF-denial acceptance tests
        run: pytest -q tests/m7/test_restricted_https.py
      - name: M7 durable inference budget and uncertain-charge tests
        run: pytest -q tests/m7/test_inference_budget.py
      - name: M7 independent offline inference sidecar and billing verifier tests
        run: |
          pytest -q tests/m7/test_inference_sidecar.py tests/m7/test_offline_billing_verifier.py
          python scripts/smoke_inference_sidecar.py
      - name: M7 coordinated dispatch and actual caller/sidecar restart acceptance
        run: |
          pytest -q tests/m7/test_inference_coordinator.py tests/m7/test_coordinated_sidecar.py tests/m7/test_coordinated_transport.py tests/m7/test_socket_lifecycle.py
          python scripts/smoke_inference_coordinator.py
      - name: M7 atomic admission, restart and rollback tests
        run: pytest -q tests/m7/test_inference_admission.py tests/m7/test_inference_admission_schema.py
      - name: M7 invocation foundation and canonical forward-migration tests
        run: pytest -q tests/m7/test_inference_dispatch_contracts.py tests/m7/test_inference_dispatch_schema.py
      - name: M7 combined PR27 budget migration and PR28 sidecar acceptance
        run: |
          python scripts/check_m7_budget_lineage.py
          pytest -q tests/m7/test_budget_lineage.py tests/m7/test_inference_budget.py tests/m7/test_offline_billing_verifier.py tests/m7/test_inference_sidecar.py
      - name: M5 offline release preparation (live gate stays blocked)
        run: python scripts/check_m5_release.py --mode offline
      - name: Compile source
        run: python -m compileall -q src
      - name: Synthetic M4 process-restart recovery smoke
        run: |
          python -m safe_agent m4-demo
      - name: M5 Google test connector offline smoke
        run: python -m safe_agent m5-demo
      - name: M6 supervised synthetic worker smoke
        run: python -m safe_agent m6-worker-demo
      - name: M6 persistent text-only planning smoke
        run: python -m safe_agent m6-planning-demo
      - name: Docker-isolated offline text model smoke (no container network)
        run: |
          docker version
          docker build --pull -f docker/model_runtime.Dockerfile -t safe-agent-offline-model:ci .
          export SAFE_AGENT_ISOLATION_IMAGE_ID="$(docker image inspect --format '{{.Id}}' safe-agent-offline-model:ci)"
          python -m safe_agent m6-isolated-model-demo
      - name: Migration head smoke (isolated SQLite fixture)
        env:
          SAFE_AGENT_DATABASE_URL: sqlite+pysqlite:///./ci-m4-migration.sqlite
        run: |
          alembic upgrade head
          python scripts/check_m7_budget_lineage.py --verify-database
          python -c "from sqlalchemy import create_engine, inspect; e=create_engine('sqlite+pysqlite:///./ci-m4-migration.sqlite'); assert {'safe_action_outbox', 'safe_fake_provider_effects', 'safe_fake_provider_state', 'safe_google_test_connections', 'safe_google_oauth_pending', 'safe_office_execution_authorizations', 'safe_google_test_outbox_bindings', 'safe_task_intake_keys', 'safe_planning_workspaces', 'safe_planning_attempts', 'safe_planning_outcomes', 'safe_inference_budget_accounts', 'safe_inference_budget_reservations', 'safe_inference_budget_events', 'safe_inference_billing_attestations'} <= set(inspect(e).get_table_names()); assert {'provider_simulation_hash', 'provider_simulation_json'} <= {x['name'] for x in inspect(e).get_columns('safe_google_test_outbox_bindings')}"

  m7-postgres-budget-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: safe_infer_ci
          POSTGRES_PASSWORD: synthetic_ci_only_not_production
          POSTGRES_DB: safe_infer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safe_infer_ci -d safe_infer_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SAFE_AGENT_DATABASE_URL: postgresql+psycopg://safe_infer_ci:synthetic_ci_only_not_production@localhost:5432/safe_infer_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and PostgreSQL driver
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev,postgres]'
      - name: Check canonical M7 budget schema before migration
        run: python scripts/check_m7_budget_lineage.py
      - name: Apply unchanged PR27 baseline then forward invocation migration
        run: |
          alembic upgrade 0009_inference_cost_accounts
          alembic upgrade head
      - name: Recheck current migration head on real PostgreSQL
        run: alembic upgrade head
      - name: Verify concurrent global and tenant cost holds, rollback, and immutable triggers
        run: python scripts/check_m7_postgres_concurrency.py
      - name: Mandatory PostgreSQL invocation constraints, history and concurrency
        env:
          SAFE_AGENT_TEST_POSTGRES_DISPATCH: '1'
        run: pytest -q tests/m7/test_inference_dispatch_postgres.py

      - name: Mandatory PostgreSQL atomic admission, rollback and restart quotas
        env:
          SAFE_AGENT_TEST_POSTGRES_ADMISSION: '1'
        run: pytest -q tests/m7/test_inference_admission_postgres.py

      - name: Mandatory PostgreSQL fenced dispatch and conservative recovery
        env:
          SAFE_AGENT_TEST_POSTGRES_COORDINATOR: '1'
        run: pytest -q tests/m7/test_coordinator_postgres.py

  tal-office-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SAFE-AGENT and pinned upstream TAL office domain
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'
          TAL_SHA="$(python scripts/read_tal_pin.py)"
          python -m pip install "git+https://github.com/AWDaley/TervoroAgenticLanguage-TAL-.git@${TAL_SHA}"
      - name: Verify TAL office-domain interoperability
        run: pytest -q tests/m4/test_tal_office_journal.py tests/m5/test_upstream_office_bridge.py tests/m4/test_tal_runtime_dispatch.py tests/m5/test_tal_execution_authority.py tests/m5/test_google_test_outbox.py tests/m5/test_google_recovery.py tests/m5/test_google_provider_binding.py tests/m5/test_google_acceptance_preflight.py
