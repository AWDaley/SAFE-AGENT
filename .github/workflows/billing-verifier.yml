name: Asymmetric billing verifier acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  billing-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verifier test environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev,api,coordinated-offline]'
      - name: Lint and type verifier boundary
        run: |
          ruff check src/safe_agent/billing src/safe_agent/billing_service src/safe_agent/contracts/billing_verification.py tests/m7/test_asymmetric_billing_verifier.py scripts/smoke_billing_verifier.py
          mypy src/safe_agent
      - name: Asymmetric verifier and public-key reconciliation tests
        run: |
          pytest tests/m7/test_asymmetric_billing_verifier.py --junitxml=billing-verifier.xml
          python -c "import xml.etree.ElementTree as E; s=E.parse('billing-verifier.xml').getroot().findall('testsuite'); assert s and sum(int(x.get('tests',0)) for x in s)>=13; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))"
      - name: Actual UDS verifier process smoke
        run: python scripts/smoke_billing_verifier.py
