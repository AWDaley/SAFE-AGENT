name: W4 operator recovery acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  recovery-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
        env:
          POSTGRES_USER: safe_recovery_ci
          POSTGRES_PASSWORD: disposable_recovery_ci_only
          POSTGRES_DB: safe_recovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safe_recovery_ci -d safe_recovery_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      SAFE_AGENT_DATABASE_URL: postgresql+psycopg://safe_recovery_ci:disposable_recovery_ci_only@localhost:5432/safe_recovery_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev,api,postgres]'
      - name: Lint and type checks
        run: |
          ruff check src tests scripts
          mypy src/safe_agent
      - name: Recovery API checks without inference
        run: |
          pytest tests/m7/test_planning_recovery.py tests/m7/test_task_retirement.py --junitxml=recovery-api.xml
          python -c "import xml.etree.ElementTree as E; s=E.parse('recovery-api.xml').getroot().findall('testsuite'); assert s and sum(int(x.get('tests',0)) for x in s)>=27; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))"
      - name: Mandatory disposable PostgreSQL recovery checks
        env:
          SAFE_AGENT_TEST_POSTGRES_RECOVERY: '1'
        run: |
          pytest tests/m7/test_recovery_postgres.py --junitxml=recovery-postgres.xml
          python -c "import xml.etree.ElementTree as E; s=E.parse('recovery-postgres.xml').getroot().findall('testsuite'); assert s and sum(int(x.get('tests',0)) for x in s)>=19; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))"
      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Network-free browser interaction checks
        env:
          SAFE_AGENT_TEST_RECOVERY_BROWSER: '1'
        run: |
          pytest tests/browser/test_planning_recovery_ui.py --junitxml=recovery-browser.xml
          python -c "import xml.etree.ElementTree as E; s=E.parse('recovery-browser.xml').getroot().findall('testsuite'); assert s and sum(int(x.get('tests',0)) for x in s)>=17; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))"
