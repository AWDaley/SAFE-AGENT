name: W4 review boundary acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  review-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: safe_review_ci
          POSTGRES_PASSWORD: disposable_review_ci_only
          POSTGRES_DB: safe_review_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safe_review_ci -d safe_review_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SAFE_AGENT_DATABASE_URL: postgresql+psycopg://safe_review_ci:disposable_review_ci_only@localhost:5432/safe_review_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install project and the reviewed TAL revision
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev,postgres]'
          TAL_SHA="$(python scripts/read_tal_pin.py)"
          python -m pip install "git+https://github.com/AWDaley/TervoroAgenticLanguage-TAL-.git@${TAL_SHA}"
          python -c "from safe_agent.tal.reviewed_runtime import require_reviewed_tal_runtime; require_reviewed_tal_runtime()"
      - name: Lint and static typing
        run: |
          ruff check src tests scripts
          mypy src/safe_agent
      - name: SQLite source-cache and mandatory TAL boundaries
        run: |
          pytest --tb=short tests/m7/test_review_boundary_regressions.py tests/m7/test_review_boundary_acceptance.py tests/m7/test_coordinated_queue_mode.py --junitxml=review-sqlite.xml
          python -c "import xml.etree.ElementTree as E; s=E.parse('review-sqlite.xml').getroot().findall('testsuite'); assert s and sum(int(x.get('tests',0)) for x in s)>=23; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))"
      - name: Mandatory real PostgreSQL source-cache and TAL boundaries
        env:
          SAFE_AGENT_TEST_POSTGRES_REVIEW: '1'
        run: |
          pytest --tb=short tests/m7/test_review_boundary_postgres.py --junitxml=review-postgres.xml
          python -c "import xml.etree.ElementTree as E; s=E.parse('review-postgres.xml').getroot().findall('testsuite'); assert s and sum(int(x.get('tests',0)) for x in s)>=19; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))"
